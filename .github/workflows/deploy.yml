# ─────────────────────────────────────────────────────────────────────────────
# SongList Backend — CI/CD Pipeline
#
# Triggers: push to `main` / `ci-test`  |  PR merged into `main`
# Jobs:     test → build & push to GHCR → SSH deploy to EC2
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy SongList Backend to EC2

on:
  push:
    branches: [main, ci-cd]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same branch so stale code is never deployed
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/songlist-backend

jobs:
  # ── 1. Run test suite ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: songlist_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: 1
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: songlist_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: songlist_backend.settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # Install all deps including dev group (factory-boy, pytest, pytest-django)
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --tb=short -v

  # ── 2. Build image → push to GHCR → deploy to EC2 ─────────────────────────
  build-and-deploy:
    needs: test
    # For PRs, only run when actually merged; always run on direct pushes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      # ── 2a. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2b. Login to GHCR ────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 2c. Build metadata (tags + labels) ───────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # ── 2d. Docker Buildx (for layer caching) ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 2e. Build & push to GHCR ─────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      # ── 2f. SSH into EC2 and deploy ───────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          script: |
            # Ensure deploy directory exists and is owned by the deploy user
            sudo mkdir -p /opt/songlist
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /opt/songlist

            # Clone repo on first deploy, otherwise fast-forward to latest commit
            if [ ! -d "/opt/songlist/.git" ]; then
              git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git /opt/songlist
            fi

            cd /opt/songlist
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Write .env from GitHub secrets
            # Single-quoted heredoc (<<'EOF') prevents the shell from expanding
            # any $ characters that may appear inside secret values
            cat > .env <<'EOF'
            DEBUG=0
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            REDIS_URL=redis://redis:6379/1
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USE_TLS=True
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            TIME_ZONE=Asia/Kolkata
            LANGUAGE_CODE=en-us
            CELERY_TIMEZONE=Asia/Kolkata
            CELERY_TASK_TIME_LIMIT=1800
            RATE_LIMIT_ENABLE=1
            RATE_LIMIT_LOGIN_ATTEMPTS=5
            RATE_LIMIT_LOGIN_WINDOW=300
            # Tells docker-compose which image to use (skips local build)
            SONGLIST_IMAGE=${{ env.IMAGE_NAME }}:latest
            EOF

            # Login to GHCR so EC2 can pull the image
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the freshly built image
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Bring up full stack without rebuilding (use pulled image)
            docker compose up -d --no-build

            # Clean up dangling images to save disk space
            docker image prune -f
