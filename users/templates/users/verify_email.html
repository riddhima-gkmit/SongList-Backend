<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .info {
            margin-bottom: 20px;
        }

        .info-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            color: #555;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Email Verification</h1>

        <!-- Error Message -->
        <div id="errorMessage" class="error"></div>

        <!-- Success Message -->
        <div id="successMessage" class="success"></div>

        <!-- Verification Form -->
        <div id="verifyForm">
            <div style="text-align: center; margin-bottom: 20px;">
                <div id="tenantName" style="font-style: italic; color: #555; font-size: 18px;">Loading...</div>
            </div>

            <div class="info">
                <div class="info-label">Email:</div>
                <div class="info-value" id="emailDisplay">Loading...</div>
            </div>

            <form id="otpForm">
                <div class="form-group">
                    <label for="otpInput">Verification Code:</label>
                    <input type="text" id="otpInput" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit code"
                        required>
                </div>

                <button type="submit" class="btn-primary" id="verifyBtn">Verify</button>
                <button type="button" class="btn-secondary" id="resendBtn">Resend Verification Email</button>
            </form>
        </div>

        <!-- Success View -->
        <div id="successView" class="hidden">
            <p style="text-align: center; color: #155724; margin-bottom: 20px;">
                ✓ Email verified successfully!<br>
                <small>This tab will close automatically...</small>
            </p>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const tenantId = urlParams.get('tenant') || 'none';
        const email = urlParams.get('email');
        const tenantName = urlParams.get('tenant_name') || tenantId;

        // API configuration
        const API_BASE = `/api/v1/tenant/${tenantId}/auth`;

        // Display tenant name
        document.getElementById('tenantName').textContent = decodeURIComponent(tenantName);

        // Display email
        if (email) {
            document.getElementById('emailDisplay').textContent = email;
        } else {
            showError('Invalid verification link - email parameter missing');
        }

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            successEl.classList.remove('show');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Show success message
        function showSuccess(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            errorEl.classList.remove('show');
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        // Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = document.getElementById('otpInput').value.trim();

            if (otp.length !== 6) {
                showError('Please enter a valid 6-digit code');
                return;
            }

            if (!email) {
                showError('Email address not found');
                return;
            }

            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const response = await fetch(`${API_BASE}/verify-email/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Email verified successfully!');
                    document.getElementById('verifyForm').classList.add('hidden');
                    document.getElementById('successView').classList.remove('hidden');

                    // Close the tab after 2 seconds
                    setTimeout(() => {
                        window.close();
                    }, 2000);
                } else {
                    // Handle specific error messages
                    let errorMsg = 'Verification failed';

                    if (data.message) {
                        errorMsg = data.message;
                    } else if (data.error) {
                        errorMsg = data.error;
                    } else if (data.detail) {
                        errorMsg = data.detail;
                    }

                    // Check for common error cases
                    if (errorMsg.toLowerCase().includes('expired')) {
                        errorMsg = 'Verification code has expired. Please click "Resend Verification Email"';
                    } else if (errorMsg.toLowerCase().includes('invalid') || errorMsg.toLowerCase().includes('incorrect')) {
                        errorMsg = 'Invalid or expired verification code. Please check and try again';
                    }

                    showError(errorMsg);
                    btn.disabled = false;
                    btn.textContent = 'Verify';
                }
            } catch (error) {
                showError('Network error. Please check your connection and try again');
                btn.disabled = false;
                btn.textContent = 'Verify';
            }
        });

        // Resend code
        document.getElementById('resendBtn').addEventListener('click', async () => {
            if (!email) {
                showError('Email address not found');
                return;
            }

            const btn = document.getElementById('resendBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE}/resend-verification/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('New verification code sent to your email!');
                    document.getElementById('otpInput').value = '';
                    document.getElementById('otpInput').focus();
                } else {
                    showError(data.message || data.error || 'Failed to resend verification email');
                }

                btn.disabled = false;
                btn.textContent = 'Resend Verification Email';
            } catch (error) {
                showError('Network error. Please try again');
                btn.disabled = false;
                btn.textContent = 'Resend Verification Email';
            }
        });

        // Focus input on load
        if (email) {
            document.getElementById('otpInput').focus();
        }
    </script>
</body>

</html>
