[project]
name = "songlist"
version = "0.1.0"
description = "Multi-tenant music content management REST API (Django/DRF). Tenants, songs, playlists, song requests, Razorpay subscriptions."
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "razorpay>=1.4.2",
    "django-redis>=5.4.0",
    "celery>=5.6.2",
    "pyotp>=2.9.0",
    "python-json-logger>=4.0.0",
]
