upstream songlist_web {
    server web:8000;
}

# NOTE:
# - HTTP (80) stays enabled for ACME challenges and redirects to HTTPS.
# - HTTPS (443) terminates TLS and proxies to the Django/Gunicorn container.
# - Update `server_name` and certificate paths if your domain changes.

server {
    listen 80;
    server_name songlist.riddhima.site;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name songlist.riddhima.site;

    ssl_certificate /etc/letsencrypt/live/songlist.riddhima.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songlist.riddhima.site/privkey.pem;

    # Optional hardening (safe defaults)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://songlist_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

