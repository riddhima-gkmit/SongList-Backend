services:
  web:
    image: ${SONGLIST_IMAGE:-songlist-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songlist-web
    # Run migrations, collect static, then start Gunicorn via New Relic admin
    command: >
      sh -c "
      uv run python manage.py migrate --noinput &&
      uv run python manage.py collectstatic --noinput &&
      uv run newrelic-admin run-program gunicorn songlist_backend.wsgi:application --bind 0.0.0.0:8000 --workers=3
      "
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: songlist_backend.settings
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    image: ${SONGLIST_IMAGE:-songlist-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songlist-celery-worker
    command: uv run newrelic-admin run-program celery -A songlist_backend worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    image: ${SONGLIST_IMAGE:-songlist-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songlist-celery-beat
    command: uv run newrelic-admin run-program celery -A songlist_backend beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: songlist-nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

  certbot:
    image: certbot/certbot:latest
    container_name: songlist-certbot
    volumes:
      - ./deploy/nginx/certbot/www:/var/www/certbot
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "echo 'Run certbot manually with the desired domain configuration'"

  db:
    image: postgres:16
    container_name: songlist-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-songlist_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-songlist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: songlist-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  static_data:
  media_data:

